site_name: Material Aula - 2026 - Fatec
site_url: https://thissyalmeida.github.io/fatec-material-aulas/
use_directory_urls: false

theme:
  name: material
  language: pt-BR

  palette:
    - scheme: default
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/style.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Boas-vindas: index.md

  - ALP - Algoritmos e Lógica de Programação:
    - Apostila de ALP:
        - Apresentação: ALP/apostila/index.md
        - Capítulo 1 — Introdução: ALP/apostila/capitulos/01-introducao-computacao.md
        - Capítulo 2 — Algoritmos: ALP/apostila/capitulos/02-algoritmos-pseudocodigo-fluxogramas.md
        - Capítulo 3 — Variáveis, Tipos de Dados e Operadores: ALP/apostila/capitulos/03-variaveis-tipos-operadores.md
        - Capítulo 4 — Entrada, Processamento e Saída de Dados: ALP/apostila/capitulos/04-entrada-processamento-saida.md
        - Capítulo 5 — Estruturas Condicionais: ALP/apostila/05-estruturas-condicionais.md
        - Capítulo 6 — Estruturas de repetição: ALP/apostila/06-estruturas-de-repeticao.md
