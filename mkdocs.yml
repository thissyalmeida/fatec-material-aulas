site_name: Apostila - Algoritmos e Linguagem de Programação
site_url: https://thissyalmeida.github.io/fatec-material-aulas/
use_directory_urls: false

theme:
  name: material
  language: pt-BR

  palette:
    - scheme: default
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/style.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
- Apostila de ALP:
  - Página inicial: ALP/apostila/index.md
  - 1. Introdução à Computação: ALP/apostila/01-introducao-computacao.md
  - 2. Algoritmos e Fluxogramas: ALP/apostila/02-algoritmos-fluxogramas.md
  - 3. Variáveis e Operadores: ALP/apostila/03-variaveis-operadores.md
  - 4. Estrutura Sequencial: ALP/apostila/04-estrutura-sequencial.md
  - 5. Estruturas Condicionais: ALP/apostila/05-estruturas-condicionais.md
  - 6. Estruturas de Repetição: ALP/apostila/06-estruturas-repeticao.md
  - 7. Introdução à Linguagem C: ALP/apostila/07-introducao-c.md
  - 8. Controle em C: ALP/apostila/08-controle-em-c.md
  - 9. Funções: ALP/apostila/09-funcoes.md
  - 10. Vetores e Matrizes: ALP/apostila/10-vetores-matrizes.md
  - 11. Memória e Binário: ALP/apostila/11-memoria-binario.md
  - 12. Testes, Estilo e Git: ALP/apostila/12-testes-estilo-git.md
