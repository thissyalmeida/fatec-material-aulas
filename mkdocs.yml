site_name: Material Aula - 2026 - Fatec
site_url: https://thissyalmeida.github.io/fatec-material-aulas/
use_directory_urls: false

theme:
  name: material
  language: pt-BR

  palette:
    - scheme: default
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: red
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/style.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Boas-vindas: index.md

  - ALP - Algoritmos e Lógica de Programação:
    - Apostila de ALP:
        - Apresentação: ALP/apostila/index.md
        - Capítulo 1 — Introdução: ALP/apostila/capitulos/01-introducao-computacao.md
    - Introdução:
        - Intro: ALP/aula-00/index.md
    - Lógica e Raciocínio:
        - Lógica e Raciocínio: ALP/aula-01/logica-e-raciocinio.md
        # O item "Exemplos: ALP/.md" do arquivo original foi omitido
        # porque o caminho aparenta estar incompleto. Reinsira-o após corrigir o destino.
    - Conceitos iniciais de Algoritmos:
        - Formas de Representação de Algoritmos: ALP/aula-02/formas-de-representacao-de-algoritmos.md
        - Exemplos: ALP/aula-02/exemplos-formas-de-representacao.md
    - Linguagem de Programação:
        - Linguagem de Programação: ALP/aula-03/linguagem-de-programacao.md
        - C:
            - Conteudo: ALP/C/conteudo-c.md
            - Exemplos: ALP/C/exemplos-c.md
        - Java:
            - Conteudo: ALP/Java/conteudo-java.md
            - Exemplos: ALP/Java/exemplos-java.md
        - JavaScript:
            - Conteudo: ALP/JavaScript/conteudo-javascript.md
            - Exemplos: ALP/JavaScript/exemplos-javascript.md
        - Kotlin:
            - Conteudo: ALP/Kotlin/conteudo-kotlin.md
            - Exemplos: ALP/Kotlin/exemplos-kotlin.md
        - Python:
            - Conteudo: ALP/Python/conteudo-python.md
            - Exemplos: ALP/Python/exemplos-python.md

  - EST - Estrutura de Dados:
    - Listas, Pilhas e Filas:
        - Exercícios: ED/aula1-introducao.md
    - Árvores e Grafos:
        - Exercícios: ED/index.md
